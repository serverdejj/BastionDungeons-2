# Etapa 1: prueba automática de mundo + schematic + entrada + salida + borrado
# ¡IMPORTANTE! Ajusta el nombre exacto del mundo Survival antes de usar.
survival-world: world
# Tiempo de prueba dentro de la mazmorra, en segundos
trial-seconds: 90
# Máximo de espera para que DeepVoid cargue el mundo
world-load-timeout-seconds: 45
# Nombres de comandos sin /; {world} se reemplaza por el nombre temporal
create-command: 'dv create {world}'
delete-command: 'dv delete {world}'
# La entrada usa Paper teleportAsync, sin /world ni permisos.
# Ubicación de pegado del origen del schematic
paste-x: 0
paste-y: 80
paste-z: 0
# El plugin busca automáticamente piso seguro dentro del .schem.
# Estos offsets se conservan por compatibilidad, pero ya no se usan para el spawn automático.
spawn-offset-x: 0.5
spawn-offset-y: 2.0
spawn-offset-z: 0.5
